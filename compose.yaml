name: word
services:
  word:
    image: ${WORD_IMAGE:-ghcr.io/koinaai/word:0.1.0}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WORD_PORT:-8080}:8080"
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@word.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a strong ADMIN_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PORT: "8080"
      DB_PATH: /app/data/word.db
      WEB_DIR: /app/web
    volumes:
      - word-data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s
volumes:
  word-data:
