name: word
services:
  word:
    image: ${WORD_IMAGE:-word:local}
    build:
      context: .
      secrets:
        - heroui_package
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      DB_PATH: /data/word.db
      WEB_DIR: /app/web
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@word.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env (12-72 bytes)}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - word-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    init: true
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  word-data:

secrets:
  heroui_package:
    file: ${HEROUI_PACKAGE_PATH:-.secrets/heroui-pro.tgz}
